name: Sync Social Posts

on:
  schedule:
    # Run every 5 minutes (standard minimum scheduler time)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  repository_dispatch:
    types: [post_created] # Triggered instantly via API on post creation

permissions:
  contents: write # Permitted to commit global feed changes back to repository

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Sync Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.APP_GITHUB_TOKEN }}
          GITHUB_ORGANIZATION: ${{ secrets.APP_GITHUB_ORGANIZATION }}
        run: node scripts/sync-posts.mjs

      - name: Commit and Push Global Feed
        run: |
          git config --global user.name "git-social-bot"
          git config --global user.email "bot@gitsocial.org"
          git add public/feeds/home.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update global home feed [skip ci]"
            git push
          else
            echo "No changes in global feed."
          fi
